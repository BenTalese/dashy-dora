# Dashy Dora — nginx config for the monolithic container image.
#
# Replaces the dev-mode `quasar serve` so the SPA is served by a real
# static-file server with the right cache headers + gzip behaviour.
#
# One port: `/api/` is proxied to dora_api on loopback, and index.html is
# marked same-origin so the SPA calls `/api` on whatever address it was
# opened on (a LAN IP, or a reverse proxy's hostname). The API counts this
# loopback hop on top of DORA_TRUSTED_PROXY_HOPS (`proxy_hops.py`).
#
# Phase D / FU-186: the retailer-scraping `merchant_api` proxy was
# removed; the companion lives in the sibling `dora-companion` repo
# and Dora doesn't know about it.

server {
    listen 5174 default_server;
    listen [::]:5174 default_server;
    server_name _;

    # Static SPA. try_files lets vue-router's history mode work — every
    # non-asset path resolves to /index.html so the client-side router
    # can take it from there.
    root /app/web_app/dist/spa;
    index index.html;

    # Baseline security headers, declared per location rather than here: a
    # server-level add_header would be inherited by `/api/`, doubling the
    # API's own headers (two X-Frame-Options values are ignored by browsers).
    # No CSP: the Quasar build relies on inline styles.

    # Pre-compressed and dynamic gzip; covers the vendor.js bundles
    # which dominate transfer size.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/wasm image/svg+xml;
    gzip_vary on;

    # FU-336: service workers must NOT be long-cached — the browser needs a
    # fresh copy to notice a new deployment and hand over to the updated worker.
    # (Modern browsers bypass the HTTP cache for the SW script on update checks,
    # but be explicit so the Workbox runtime + older browsers can't get pinned
    # to a stale worker.) Must precede the generic hashed-asset block below —
    # nginx evaluates regex locations in order.
    location ~* ^/(?:sw|push-sw)\.js$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Long-cache hashed assets; short-cache index.html so deployments
    # roll out quickly without a hard refresh.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        # Same marker the API adds when it serves the SPA itself
        # (`serve_spa.py` SAME_ORIGIN_META).
        sub_filter_once on;
        sub_filter '<head>' '<head><meta name="dora-api-same-origin" content="1">';
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # `^~` so the asset regex above never claims an API path ending in .png.
    # X-Forwarded-Proto/Host pass through untouched from any outer proxy; the
    # API sets its own security headers. No body limit, like the API.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5170;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # ── Lightweight health probe so the container HEALTHCHECK has
    # something quick to hit without exercising the Python APIs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }
}
