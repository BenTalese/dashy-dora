# Dashy Dora — nginx config for the monolithic container image.
#
# Replaces the dev-mode `quasar serve` so the SPA is served by a real
# static-file server with the right cache headers + gzip behaviour.
#
# Today's deployment exposes dora_api directly on 5170 alongside this
# SPA host on 5174, and the frontend resolves it via VITE_API_BASE_URL.
# The commented-out `/api/` block below is the migration path to a
# "single port" deployment when you want to expose just port 5174
# externally — flip the frontend over to relative URLs (drop the
# host/port from VITE_API_BASE_URL) and uncomment.
#
# Phase D / FU-186: the retailer-scraping `merchant_api` proxy was
# removed; the companion lives in the sibling `dora-companion` repo
# and Dora doesn't know about it.

server {
    listen 5174 default_server;
    listen [::]:5174 default_server;
    server_name _;

    # Static SPA. try_files lets vue-router's history mode work — every
    # non-asset path resolves to /index.html so the client-side router
    # can take it from there.
    root /app/web_app/dist/spa;
    index index.html;

    # Baseline security headers. No CSP: the Quasar build relies on inline
    # styles. nginx only inherits add_header into a location that declares
    # none of its own, so every location below with an add_header repeats
    # these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pre-compressed and dynamic gzip; covers the vendor.js bundles
    # which dominate transfer size.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/wasm image/svg+xml;
    gzip_vary on;

    # FU-336: service workers must NOT be long-cached — the browser needs a
    # fresh copy to notice a new deployment and hand over to the updated worker.
    # (Modern browsers bypass the HTTP cache for the SW script on update checks,
    # but be explicit so the Workbox runtime + older browsers can't get pinned
    # to a stale worker.) Must precede the generic hashed-asset block below —
    # nginx evaluates regex locations in order.
    location ~* ^/(?:sw|push-sw)\.js$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Long-cache hashed assets; short-cache index.html so deployments
    # roll out quickly without a hard refresh.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Lightweight health probe so the container HEALTHCHECK has
    # something quick to hit without exercising the Python APIs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    # ── Single-port deployment hook (off by default) ────────────────
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5170;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
