# Dashy Dora — monolithic-container compose file.
#
# Phase D / FU-186: dora_api runs alongside nginx serving the built SPA.
# The retailer-scraping `merchant_api` + the deals `emailer` live in the
# sibling **dora-companion** repo now — Dora never calls out; sources
# call in via `POST /api/ingest`. See Dockerfile + startup.sh.
#
# ── Overrides (host customisations without editing this file) ─────────
# Drop a `compose.override.yml` next to this file. Compose merges it
# automatically. Common reasons to override:
#   - bind-mount a local source tree for dev edits
#   - swap the image tag
#   - widen exposed ports
#   - bump healthcheck intervals

# Project name. Without this Compose derives it from the checkout directory,
# which is still `DiscountDora/` (the local clone was never renamed with the
# product — see CLAUDE.md → Naming). That leaked the retired
# name into every generated resource: `discountdora_dora_logs`,
# `discountdora_dora_data`, and so on. Pinning it here decouples the deployment
# from the directory name entirely, so a future repo rename is a no-op.
#
# NOTE for existing deployments: this renames the four named volumes below.
# The old `discountdora_*` volumes are not deleted, just no longer referenced —
# the stack comes up with empty ones. Copy the data across first if you need it.
name: dashy-dora

services:
  dashy_dora:
    container_name: dashy_dora
    # image: <IMAGE HOSTING SERVICE>/dashydora:latest
    # ↑ Once the image lives in a registry, drop the `build:` block and
    # use this instead.
    build:
      context: .
      dockerfile: Dockerfile
    restart: always

    # ── Pass the operator's whole .env through ────────────────────────
    # The `environment:` block below is an explicit allow-list: anything
    # an operator sets in `.env` that ISN'T named there is silently
    # dropped on the floor. That is exactly how DORA_SECRET_ENCRYPTION_KEY
    # went missing (2026-08-17) — set correctly in `.env`, never reached
    # the container, and the app reported "Secret encryption isn't set up".
    # `env_file` closes the whole class of bug: every var in `.env` is
    # forwarded whether or not this file knows about it. The block below
    # then stays for what it's actually good at — documenting the vars and
    # supplying container defaults (values there win over `env_file`).
    # `required: false` needs Compose v2.24+; on older versions drop the
    # two lines and the file becomes mandatory.
    env_file:
      - path: .env
        required: false

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Australia/Sydney}

      # ── Profile (D3) ───────────────────────────────────────────────
      # Containers default to `production` so a `docker compose up`
      # behaves prod-strict out of the box (fails fast on missing
      # required vars). Set DORA_ENV=development in your local .env
      # for the open-CORS / debug-log / seed-allowed dev defaults.
      - DORA_ENV=${DORA_ENV:-production}

      # ── Secrets / auth ─────────────────────────────────────────────
      - DORA_SECRET_KEY=${DORA_SECRET_KEY:-}
      # The KEK that wraps every secret stored at rest (SMTP password,
      # VAPID private key, per-user LLM API keys). It was missing from
      # this block until 2026-08-17 — an operator who set it in `.env`
      # still got "Secret encryption isn't set up on this install" in the
      # container, because compose never forwarded it. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - DORA_SECRET_ENCRYPTION_KEY=${DORA_SECRET_ENCRYPTION_KEY:-}
      - DORA_CORS_ORIGINS=${DORA_CORS_ORIGINS:-}
      - DORA_SECURE_COOKIES=${DORA_SECURE_COOKIES:-false}
      # Reverse proxies in front of the API (X-Forwarded-For hops to trust).
      # 0 = none. Set 1 behind nginx / Caddy / Traefik / a Cloudflare tunnel.
      - DORA_TRUSTED_PROXY_HOPS=${DORA_TRUSTED_PROXY_HOPS:-0}
      - DORA_ALLOW_DESTRUCTIVE=${DORA_ALLOW_DESTRUCTIVE:-false}

      # ── Storage paths (match the volume mounts below) ──────────────
      - DORA_DATA_DIR=${DORA_DATA_DIR:-/app/data}
      - DORA_CACHE_DIR=${DORA_CACHE_DIR:-/app/cache}
      - DORA_LOG_DIR=${DORA_LOG_DIR:-/app/logs}

      # ── Database (FU-045) ───────────────────────────────────────────
      # The self-host monolith defaults to **SQLite** to stay zero-
      # dependency. `DORA_DB_PATH` is the friendly SQLite shortcut:
      # just a filesystem path inside the container, no URL syntax to
      # remember. To point at an external Postgres instead, leave
      # DORA_DB_PATH unset and provide a full URL:
      #   DORA_DB_URL=postgresql+psycopg://user:pass@host:5432/dbname
      # Dev workstations use Postgres via `compose.dev.yml`; this
      # production compose is the lightweight SQLite path on purpose.
      - DORA_DB_PATH=${DORA_DB_PATH:-/app/data/dora.data.db}
      - DORA_DB_URL=${DORA_DB_URL:-}
      # Per-component Postgres vars — the third resolution step in
      # `configuration_manager.get_db_connection_string()`, for when the
      # credentials come from the environment but the shape is fixed.
      # Only consulted when both DORA_DB_URL and DORA_DB_PATH are unset.
      - DORA_DB_HOST=${DORA_DB_HOST:-}
      - DORA_DB_PORT=${DORA_DB_PORT:-}
      - DORA_DB_NAME=${DORA_DB_NAME:-}
      - DORA_DB_USER=${DORA_DB_USER:-}
      - DORA_DB_PASSWORD=${DORA_DB_PASSWORD:-}

      # ── API tuning (optional; defaults baked into appsettings) ─────
      - DORA_API_PORT=${DORA_API_PORT:-5170}
      - DORA_LOG_LEVEL=${DORA_LOG_LEVEL:-ERROR}
      - DORA_DEBUG=${DORA_DEBUG:-}

      # ── API server (FU-397) ────────────────────────────────────────
      # Production serves the API via gunicorn (real WSGI server) instead
      # of Flask's dev server; `auto` picks it from DORA_ENV. Keep
      # DORA_WEB_CONCURRENCY=1 — the in-process scheduler must run once
      # (more workers duplicate the daily/hourly jobs). See gunicorn.conf.py.
      - DORA_API_SERVER=${DORA_API_SERVER:-auto}
      - DORA_WEB_CONCURRENCY=${DORA_WEB_CONCURRENCY:-1}
      - DORA_WEB_THREADS=${DORA_WEB_THREADS:-4}
      - DORA_WEB_TIMEOUT=${DORA_WEB_TIMEOUT:-120}

      # ── Email / push / voice / hosting: NOT here, by design ────────
      # SMTP, VAPID, the Piper paths, `email_enabled`,
      # `audit_retention_days` and `public_url` were promoted to
      # AppSetting rows by IMPL_PLAN_ENV_TO_APPSETTING and are edited
      # under Settings → Admin. Their env vars survive **only** inside
      # migration b7d2f9c1e4a3, which read them once at upgrade time —
      # there is no runtime fallback. Forwarding them here would advertise
      # settings that do nothing. (This block used to carry
      # `DORA_SMTP_USER` + `DORA_SMTP_PASSWORD`: the first is a misspelling
      # of `DORA_SMTP_USERNAME` that nothing has ever read, and the second
      # is a wrapped secret with no env path at all. Both removed
      # 2026-08-17.)

      # ── Support channel (author-controlled, read at runtime) ───────
      # Where "Report an issue" points. Deliberately env-only, never an
      # admin AppSetting — see PROPOSAL_SUPPORT_CHANNEL.
      - DORA_SUPPORT_URL=${DORA_SUPPORT_URL:-}
      - DORA_SUPPORT_EMAIL=${DORA_SUPPORT_EMAIL:-}

      # ── Demo mode (FU-392, read at runtime) ────────────────────────
      # Serves the curated showcase dataset + a persistent banner, and
      # periodically resets itself. Env-only by design so a prospect
      # poking around the demo admin can't switch it off. Off unless set.
      - DORA_DEMO_MODE=${DORA_DEMO_MODE:-}
      - DORA_DEMO_RESET_MINUTES=${DORA_DEMO_RESET_MINUTES:-}

      # ── TTS voices (read at runtime) ───────────────────────────────
      # Where Piper voice models are stored. Defaults to <DATA_DIR>/voices,
      # which rides the dora_data volume — only set this to stage models
      # on a different mount.
      - DORA_PIPER_VOICE_DIR=${DORA_PIPER_VOICE_DIR:-}

      # ── Bootstrap admin ────────────────────────────────────────────
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}

      # ── Deliberately NOT forwarded ─────────────────────────────────
      # DORA_CSRF_DISABLED, DORA_DISABLE_SECURITY_HEADERS,
      # DORA_SKIP_PROD_VALIDATION — dev-only escape hatches that weaken
      # the install; naming them here invites someone to set one "just to
      # get past" a boot failure. DORA_SEED_* are dev-seed knobs
      # (DORA_ALLOW_DESTRUCTIVE is forwarded above but inert here —
      # `is_seed_allowed()` returns false in production regardless).
      # DORA_API_HOST / _BIND / _SPA_DIR / _WEB_APP_* / _GUNICORN_LOG_LEVEL
      # are container-internal and set by the Dockerfile.
      # These are all still reachable via `env_file` if an operator really
      # means it — this list documents intent, it isn't a lock.

    ports:
      - "5170:5170"   # dora_api
      - "5174:5174"   # nginx (SPA)

    # Named volumes per data type so backups / migrations can target
    # one without dragging the others along. `docker compose down -v`
    # clears them all; `docker compose down` keeps them.
    volumes:
      - dora_data:/app/data       # sqlite + uploads
      - dora_cache:/app/cache     # image cache + scraped json
      - dora_logs:/app/logs       # application logs
      # NOTE for existing deployments: the `dora_config:/app/config` volume is
      # gone. `dapi.appsettings.json` lives at `<DORA_DATA_DIR>/config/` (inside
      # `dora_data`) and has since 2026-05; `/app/config` was only the legacy
      # source the boot-time migration moved it *out of*. A leftover named
      # volume is harmless — `docker volume rm <project>_dora_config` to drop it.

    # Container-level healthcheck — hits nginx's lightweight /healthz
    # so a wedged Python API doesn't take down the whole container
    # (the SPA + nginx stay up while you debug). The Dockerfile sets
    # the same default; declaring it here too means a future image
    # without HEALTHCHECK still gets one in this deployment.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5174/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  dora_data:
  dora_cache:
  dora_logs:
