name: Release

# D4 — manual release. NEVER runs automatically. You trigger it from
# the GitHub Actions UI (Actions → Release → Run workflow) and supply
# a version string like `v0.3.0`.
#
# What it does:
#   1. Validates the version is a clean `vMAJOR.MINOR.PATCH` (optional
#      pre-release suffix accepted: `v0.3.0-rc.1`).
#   2. Builds the desktop installers, one job per OS (PyInstaller can't
#      cross-compile):
#        - Windows  Dora-vX.Y.Z-windows-x64-setup.exe   (Inno Setup)
#        - Linux    Dora-vX.Y.Z-linux-x86_64.AppImage
#      Each is then started on its runner (Windows: installed first) and
#      must answer /api/health and hand a second launch over to the running
#      copy, so a bundle that can't boot fails the release. No macOS build
#      (FU-1003). Neither is code-signed; the README's install section has
#      the SmartScreen step.
#   3. Builds the monolithic Docker image (linux/amd64) and pushes it
#      to ghcr.io tagged BOTH `vX.Y.Z` AND `latest` so pin-this-version
#      deploys + self-hosters tracking latest both work. Runs only once
#      every installer has built, so a broken installer publishes nothing.
#   4. Cuts a GitHub Release with the matching tag, this version's
#      CHANGELOG.md section as the body and the installers attached.
#
# Dry run: builds everything but pushes no image and cuts no Release.
# The installers are still kept as workflow artifacts on the run page,
# so a dry run is how to try them before releasing.
#
# The tag may already exist (pushed by hand). Then the release is built
# from the commit the tag points at, whichever branch the run was started
# from, and only a tag that already has a GitHub Release is refused.
# Without a tag, the release builds the dispatched commit and tags it.
#
# Required permissions:
#   - contents: write   → create the git tag + GitHub Release
#   - packages: write   → push to ghcr.io

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Release version (e.g. v0.3.0). Must match v<major>.<minor>.<patch>[-<pre>]."
                required: true
                type: string
            dry_run:
                description: "Build everything but don't push to ghcr.io or create the GitHub Release (installers stay as run artifacts)."
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    # One release at a time. Newer triggers wait rather than cancel
    # so we don't half-publish an image.
    group: release-${{ github.workflow }}
    cancel-in-progress: false

jobs:
    # ─────────────────────────────────────────────────────────────────
    # 1. Validate the version + resolve the commit to release
    # ─────────────────────────────────────────────────────────────────
    prepare:
        name: Prepare ${{ inputs.version }}
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            plain: ${{ steps.version.outputs.plain }}
            image: ${{ steps.version.outputs.image }}
            sha: ${{ steps.tag.outputs.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Reject anything that isn't `vMAJOR.MINOR.PATCH` (with
            # optional pre-release suffix). Catches typos before we do
            # any work that costs time.
            - name: Validate version
              id: version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -e
                  if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
                      echo "::error::Version '$VERSION' isn't a clean vX.Y.Z. Use e.g. v0.3.0 or v0.3.0-rc.1."
                      exit 1
                  fi
                  # Lowercase the image name (ghcr is case-sensitive).
                  IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "plain=${VERSION#v}" >> $GITHUB_OUTPUT
                  echo "image=$IMAGE" >> $GITHUB_OUTPUT
                  echo "Releasing $IMAGE:$VERSION"

            # An existing tag is the release point: every later job
            # checks out this SHA, so the image, the installers, the
            # notes and the Release all come from that commit. What
            # counts as "already published" is a GitHub Release for the
            # tag, not the tag itself.
            - name: Resolve release commit
              id: tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  set -e
                  if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                      git checkout -q --detach "refs/tags/$VERSION^{commit}"
                      echo "Tag $VERSION exists; releasing its commit $(git rev-parse --short HEAD)."
                  else
                      echo "No tag $VERSION yet; releasing ${GITHUB_SHA::8} and tagging it."
                  fi
                  echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                  if [ "$DRY_RUN" != "true" ] && gh release view "$VERSION" >/dev/null 2>&1; then
                      echo "::error::$VERSION already has a GitHub Release. Pick a new version."
                      exit 1
                  fi

            # The app reports CURRENT_VERSION in Settings → About and the
            # installers carry the tag's version; flag a forgotten bump.
            - name: Check CURRENT_VERSION matches
              env:
                  PLAIN: ${{ steps.version.outputs.plain }}
              run: |
                  APP=$(sed -n 's/^CURRENT_VERSION *= *"\([^"]*\)".*/\1/p' dora_api/features/help/version_info.py)
                  if [ "$APP" != "$PLAIN" ]; then
                      echo "::warning::version_info.py says CURRENT_VERSION = \"$APP\" but you're releasing $PLAIN. The app will report $APP."
                  fi

    # ─────────────────────────────────────────────────────────────────
    # 2. Desktop installers — one native runner per OS
    # ─────────────────────────────────────────────────────────────────
    desktop:
        name: Desktop installer (${{ matrix.label }})
        needs: prepare
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: Windows x64
                      key: windows
                      runner: windows-latest
                    # 22.04 on purpose: an AppImage runs on distros at
                    # least as new as the glibc it was built against.
                    - label: Linux x86_64
                      key: linux
                      runner: ubuntu-22.04
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            PLAIN: ${{ needs.prepare.outputs.plain }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.sha }}

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: web_app/package-lock.json

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: Install dependencies
              shell: bash
              run: |
                  set -e
                  (cd web_app && npm ci)
                  python -m pip install --upgrade pip
                  # Pillow (also pystray's) makes the installer's .ico.
                  pip install -r requirements.txt

            # ── Windows: PyInstaller → Inno Setup ─────────────────────
            - name: Install Inno Setup
              if: matrix.key == 'windows'
              shell: pwsh
              run: |
                  if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
                      choco install innosetup -y --no-progress
                  }

            - name: Build Windows installer
              if: matrix.key == 'windows'
              shell: pwsh
              run: .\packaging\build-windows.ps1 -Installer -Version $env:PLAIN

            # ── Linux: PyInstaller → AppImage ─────────────────────────
            # appimagetool is itself an AppImage and runners have no
            # FUSE; extract-and-run sidesteps that.
            - name: Build Linux AppImage
              if: matrix.key == 'linux'
              env:
                  APPIMAGE_EXTRACT_AND_RUN: "1"
              run: |
                  set -e
                  ./packaging/build-linux.sh --appimage
                  mv dist/Dora-v*-x86_64.AppImage "dist/Dora-${VERSION}-linux-x86_64.AppImage"

            # ── Smoke test: install, start, second launch, stop ───────
            # Port 5180 is the desktop app's fixed port. No browser on a
            # runner, so DORA_DESKTOP_OPEN_BROWSER=false.
            - name: Smoke test Windows installer
              if: matrix.key == 'windows'
              shell: pwsh
              env:
                  DORA_DESKTOP_OPEN_BROWSER: "false"
              run: |
                  $ErrorActionPreference = 'Stop'
                  $setup = Get-ChildItem dist\Dora-*-setup.exe | Select-Object -First 1
                  $install = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART' -Wait -PassThru
                  if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
                  $exe = Join-Path $env:LOCALAPPDATA 'Programs\Dora\Dora.exe'
                  if (-not (Test-Path $exe)) { throw "Dora.exe not installed at $exe" }
                  $dora = Start-Process $exe -PassThru
                  $health = $null
                  for ($i = 0; $i -lt 120 -and -not $health; $i++) {
                      Start-Sleep -Seconds 1
                      try { $health = Invoke-RestMethod http://127.0.0.1:5180/api/health -TimeoutSec 2 } catch { }
                  }
                  if (-not $health) {
                      Get-Content (Join-Path $env:LOCALAPPDATA 'BenTalese\Dora\Logs\desktop.log') -ErrorAction SilentlyContinue
                      throw "Dora didn't answer /api/health within 120s"
                  }
                  Write-Host "Dora $($health.version) up, db=$($health.db), schema=$($health.schema_version_db)"
                  if ($health.schema_version_db -ne $health.schema_version) { throw "Migrations didn't reach head" }
                  $second = Start-Process $exe -Wait -PassThru
                  if ($second.ExitCode -ne 0) { throw "Second launch exited $($second.ExitCode)" }
                  Stop-Process -Id $dora.Id -Force
                  Start-Sleep -Seconds 2
                  $uninstall = Start-Process (Join-Path $env:LOCALAPPDATA 'Programs\Dora\unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
                  if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
                  Start-Sleep -Seconds 3
                  if (Test-Path $exe) { throw "Uninstall left $exe behind" }
                  Write-Host "Installed, started, handed off a second launch, uninstalled."

            - name: Smoke test Linux AppImage
              if: matrix.key == 'linux'
              env:
                  APPIMAGE_EXTRACT_AND_RUN: "1"
                  DORA_DESKTOP_OPEN_BROWSER: "false"
              run: |
                  set -e
                  APP=$(ls dist/Dora-*-linux-x86_64.AppImage)
                  export HOME="$RUNNER_TEMP/dora-home"
                  mkdir -p "$HOME"
                  "$APP" > "$RUNNER_TEMP/dora.log" 2>&1 &
                  DORA_PID=$!
                  for i in $(seq 1 120); do
                      curl -sf http://127.0.0.1:5180/api/health > "$RUNNER_TEMP/health.json" && break
                      if ! kill -0 "$DORA_PID" 2>/dev/null; then break; fi
                      sleep 1
                  done
                  if [ ! -s "$RUNNER_TEMP/health.json" ]; then
                      cat "$RUNNER_TEMP/dora.log"
                      echo "::error::Dora didn't answer /api/health within 120s"
                      exit 1
                  fi
                  python -c "import json,sys; h=json.load(open(sys.argv[1])); print('Dora', h['version'], 'db', h['db'], 'schema', h['schema_version_db']); sys.exit(h['schema_version_db'] != h['schema_version'])" "$RUNNER_TEMP/health.json"
                  timeout 60 "$APP"
                  kill "$DORA_PID"
                  echo "Started, handed off a second launch, stopped."

            - name: Keep the installer
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-${{ matrix.key }}
                  path: |
                      dist/Dora-*-setup.exe
                      dist/Dora-*.AppImage
                  if-no-files-found: error
                  retention-days: 30

    # ─────────────────────────────────────────────────────────────────
    # 3. Docker image — only once every installer built
    # ─────────────────────────────────────────────────────────────────
    docker:
        name: Docker image
        needs: [prepare, desktop]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.sha }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: ${{ !inputs.dry_run }}
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Single-platform for now; bump to multi-arch when we have
            # a real ARM target. GHA's docker buildx cache keeps repeat
            # builds reasonably fast.
            - name: Build + push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: ${{ !inputs.dry_run }}
                  tags: |
                      ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
                      ${{ needs.prepare.outputs.image }}:latest
                  build-args: |
                      DORA_BUILD_ID=${{ needs.prepare.outputs.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  labels: |
                      org.opencontainers.image.title=DashyDora
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
                      org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

    # ─────────────────────────────────────────────────────────────────
    # 4. GitHub Release with the installers attached
    # ─────────────────────────────────────────────────────────────────
    publish:
        name: Publish ${{ inputs.version }}
        needs: [prepare, desktop, docker]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            PLAIN: ${{ needs.prepare.outputs.plain }}
            IMAGE: ${{ needs.prepare.outputs.image }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare.outputs.sha }}

            - name: Collect installers
              uses: actions/download-artifact@v4
              with:
                  pattern: desktop-*
                  path: release-assets
                  merge-multiple: true

            # The release steps rename `## [Unreleased]` to `## [X.Y.Z] - <date>`
            # before running this, so the notes are that section: from its
            # heading to the next `## ` heading. Falls back to [Unreleased]
            # when no section names the version yet. An install footer
            # points people at the right file for their computer.
            - name: Extract release notes from CHANGELOG
              id: notes
              run: |
                  set -e
                  NOTES="$RUNNER_TEMP/release-notes.md"
                  extract() {
                      awk -v head="$1" '
                          index($0, head) == 1 { in_block=1; next }
                          /^## / && in_block   { exit }
                          in_block             { print }
                      ' CHANGELOG.md
                  }
                  if [ -f CHANGELOG.md ]; then
                      extract "## [$PLAIN]" > "$NOTES"
                      if [ ! -s "$NOTES" ]; then
                          extract "## [Unreleased]" > "$NOTES"
                      fi
                  fi
                  if [ ! -s "$NOTES" ]; then
                      echo "No CHANGELOG section for $PLAIN; using a stub." > "$NOTES"
                  fi
                  cat >> "$NOTES" <<EOF

                  ## Install

                  - **Windows:** \`Dora-${VERSION}-windows-x64-setup.exe\`
                  - **Linux:** \`Dora-${VERSION}-linux-x86_64.AppImage\`
                  - **Server / Docker:** \`docker pull ${IMAGE}:${VERSION}\`

                  The desktop apps aren't code-signed yet, so Windows warns the first time you open it.
                  See [Install on desktop](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#install-on-desktop) for the steps.
                  EOF
                  echo "path=$NOTES" >> $GITHUB_OUTPUT

            # `softprops/action-gh-release` creates the tag (at the
            # resolved commit) when it doesn't exist yet, and uses it
            # as-is when it does.
            - name: Create GitHub Release
              if: ${{ !inputs.dry_run }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.prepare.outputs.version }}
                  target_commitish: ${{ needs.prepare.outputs.sha }}
                  name: ${{ needs.prepare.outputs.version }}
                  body_path: ${{ steps.notes.outputs.path }}
                  files: release-assets/*
                  fail_on_unmatched_files: true
                  draft: false
                  prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}

            - name: Summary
              env:
                  DRY_RUN: ${{ inputs.dry_run }}
              run: |
                  {
                      if [ "$DRY_RUN" = "true" ]; then
                          echo "### Release $VERSION (DRY RUN)"
                      else
                          echo "### Release $VERSION"
                      fi
                      echo ""
                      echo "Image: \`$IMAGE:$VERSION\`"
                      echo ""
                      echo "Installers:"
                      for f in release-assets/*; do
                          echo "- \`$(basename "$f")\` ($(du -m "$f" | cut -f1) MB)"
                      done
                      echo ""
                      if [ "$DRY_RUN" = "true" ]; then
                          echo "_Dry run — nothing was pushed and no GitHub Release was cut. The installers are in this run's artifacts._"
                      else
                          echo "Pull with: \`docker pull $IMAGE:$VERSION\`"
                      fi
                  } >> $GITHUB_STEP_SUMMARY
